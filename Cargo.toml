[package]
name = "kodegen_tools_sequential_thinking"
version = "0.1.0"
edition = "2024"
description = "KODEGEN.ᴀɪ: Memory-efficient, Blazing-Fast, MCP tools for code generation agents."
authors = ["KODEGEN.ᴀɪ"]
homepage = "https://kodegen.ai"
repository = "https://github.com/cyrup-ai/kodegen-tools-sequential-thinking"
readme = "README.md"
categories = ["development-tools", "command-line-utilities", "api-bindings"]
keywords = [
    "mcp",
    "terminal",
    "agent",
    "filesystem",
    "claude"
]
license = "Apache-2.0 OR MIT"

[package.metadata.bundle]
identifier = "ai.kodegen.kodegen_tools_sequential_thinking"
publisher = "KODEGEN.ᴀɪ"
category = "Developer Tool"
copyright = "Copyright © 2025"
short_description = "Memory-efficient, Blazing-Fast, MCP tools for code generation agents."


[dependencies]
kodegen_mcp_tool = { version = "0.1" }
kodegen_mcp_schema = { version = "0.1" }
kodegen_server_http = { version = "0.1" }

# MCP SDK - for Tool implementation and prompt types
rmcp = { version = "0.8", features = ["client", "schemars", "server", "transport-child-process", "transport-io", "transport-sse-client", "transport-sse-client-reqwest", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "transport-sse-server"]}

# Async runtime - for tokio::sync::RwLock
tokio = { version = "1", features = ["full"] }

# Serialization - for Args and responses
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Schema generation - for JsonSchema derive
schemars = "1"

# Error handling - for anyhow::anyhow! macro
anyhow = "1"

# Logging - for log::debug! macro
log = "0.4"

# Synchronization primitives - for Arc<RwLock<ThinkingState>>
parking_lot = "0.12"

# Terminal colors - for formatted stderr output
cyrup_termcolor = "2"

# Cross-platform paths - for XDG config directory resolution
dirs = "6"

# UUID generation - for unique session IDs
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
kodegen_mcp_client = { version = "0.1"  }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }

[lib]
name = "kodegen_tools_sequential_thinking"
path = "src/lib.rs"

[features]
default = []
server = []

[[bin]]
name = "kodegen-sequential-thinking"
path = "src/main.rs"
